<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="CodeFusion">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#101b2e"/>
      <stop offset="1" stop-color="#0d2436"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#2B7FFF"/>
    </linearGradient>
    <linearGradient id="warm" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="4" y="4" width="248" height="248" rx="56" fill="url(#bg)" stroke="#24324d" stroke-width="2"/>
  <!-- launcher ring -->
  <circle cx="128" cy="128" r="80" fill="none" stroke="url(#edge)" stroke-width="3" opacity="0.55"/>
  <circle cx="128" cy="128" r="54" fill="none" stroke="url(#edge)" stroke-width="2" opacity="0.35" stroke-dasharray="4 7"/>
  <!-- nine seats -->
  <g filter="url(#glow)">
    <rect x="70" y="70" width="26" height="26" rx="7" fill="url(#edge)" opacity="0.95"/>
    <rect x="115" y="70" width="26" height="26" rx="7" fill="url(#edge)" opacity="0.75"/>
    <rect x="160" y="70" width="26" height="26" rx="7" fill="url(#warm)" opacity="0.95"/>
    <rect x="70" y="115" width="26" height="26" rx="7" fill="url(#edge)" opacity="0.75"/>
    <rect x="115" y="115" width="26" height="26" rx="9" fill="#e2e8f0"/>
    <rect x="160" y="115" width="26" height="26" rx="7" fill="url(#warm)" opacity="0.75"/>
    <rect x="70" y="160" width="26" height="26" rx="7" fill="url(#warm)" opacity="0.95"/>
    <rect x="115" y="160" width="26" height="26" rx="7" fill="url(#warm)" opacity="0.75"/>
    <rect x="160" y="160" width="26" height="26" rx="7" fill="url(#edge)" opacity="0.95"/>
  </g>
  <!-- editor / fusion fork -->
  <g fill="none" stroke="#e2e8f0" stroke-width="4" stroke-linecap="round" opacity="0.9">
    <path d="M128 141v18"/>
    <path d="M128 159l-20 14"/>
    <path d="M128 159l20 14"/>
  </g>
  <circle cx="108" cy="176" r="4" fill="#22d3ee"/>
  <circle cx="148" cy="176" r="4" fill="#f472b6"/>
</svg>
